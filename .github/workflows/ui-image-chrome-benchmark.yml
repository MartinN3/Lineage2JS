name: Fork-only UI image Chrome benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated benchmark tools
        run: npm install --prefix "${{ runner.temp }}/ui-image-tools" playwright@1.57.0 typescript@5.9.3
      - name: Install Chrome for Testing
        run: node "${{ runner.temp }}/ui-image-tools/node_modules/playwright/cli.js" install chrome
      - name: Run paired UI image benchmark
        env:
          BASELINE_REVISION: 395753475f5d7badea32bd6bc0dd78609f9ff293
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ui-image-tools/node_modules/playwright
          TYPESCRIPT_MODULE: ${{ runner.temp }}/ui-image-tools/node_modules/typescript
          OUTPUT_JSON: ${{ runner.temp }}/ui-image-benchmark.json
          GITHUB_RUNNER_OS: ${{ runner.os }}
        run: node tests/ui-image-performance.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-image-benchmark-${{ runner.os }}
          path: ${{ runner.temp }}/ui-image-benchmark.json
          if-no-files-found: warn
